<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>主线 / 支线</title>
    <script>
      if (window.desktopBridge) {
        document.documentElement.classList.add("electron-shell");
        document.documentElement.dataset.desktopPanel =
          new URLSearchParams(location.search).get("panel") || "widget";
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --ink: #24251f;
        --muted: #92938b;
        --line: #ecece7;
        --paper: #fffefa;
        --green: #607b61;
        --orange: #c27a54;
        --red: #c85f51;
        --theme-art: none;
        --theme-shadow: rgba(44, 43, 35, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f2f1ed;
        color: var(--ink);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
        display: flex;
        justify-content: flex-end;
        align-items: flex-start;
        padding: 28px;
      }
      .electron-shell,
      .electron-shell body {
        background: transparent !important;
      }
      .electron-shell body {
        overflow: hidden;
      }
      html[data-desktop-panel="widget"] #schedule-card {
        visibility: hidden !important;
        pointer-events: none !important;
      }
      html[data-desktop-panel="schedule"] #widget {
        visibility: hidden !important;
        pointer-events: none !important;
        /* This hidden mirror supplies exact docking bounds, not animation frames. */
        transition: none !important;
      }
      html[data-desktop-panel="schedule"] .draft-window {
        display: none !important;
      }
      .widget {
        position: relative;
        width: 352px;
        min-height: 220px;
        background: var(--paper);
        border: 1px solid rgba(40, 40, 32, 0.07);
        border-radius: 19px;
        box-shadow:
          0 18px 55px var(--theme-shadow),
          0 2px 8px rgba(44, 43, 35, 0.04);
        overflow: visible;
        display: flex;
        flex-direction: column;
        transition:
          min-height 0.24s ease,
          width 0.24s ease,
          padding 0.24s ease,
          border-radius 0.24s ease,
          box-shadow 0.24s ease;
      }
      .widget:before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image: var(--theme-art);
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;
        border-radius: inherit;
        opacity: 0;
        transition: opacity 0.25s;
      }
      .widget > * {
        position: relative;
        z-index: 1;
      }
      .widget[data-theme]:not([data-theme="default"]):before {
        opacity: 0.42;
      }
      .widget[data-theme="anu"] {
        --paper: rgba(255, 254, 246, 0.88);
        --line: rgba(24, 54, 88, 0.2);
        --green: #183b68;
        --orange: #b28b3d;
        --ink: #1e2e43;
        --theme-shadow: rgba(23, 52, 87, 0.18);
        border: 2px solid #173c69;
        border-radius: 23px;
        box-shadow:
          0 18px 55px var(--theme-shadow),
          inset 0 0 0 2px rgba(185, 146, 58, 0.5);
      }
      .widget[data-theme="anu"]:before {
        opacity: 0.55;
      }
      .widget[data-theme="anu"] .topline {
        padding-left: 62px;
      }
      .widget[data-theme="anu"] .clock {
        margin-left: 62px;
      }
      .widget[data-theme="anu"] .section-label.mainline,
      .widget[data-theme="anu"] .section-label.side {
        color: var(--green);
      }
      .widget[data-theme="anu"] .task,
      .widget[data-theme="anu"] .footer,
      .widget[data-theme="anu"] .top {
        border-color: var(--line);
      }
      .widget[data-theme="anu"] .add {
        color: var(--green);
      }
      .anu-brand {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        width: 42px;
        height: 48px;
        padding: 3px 2px;
        background: rgba(255, 255, 255, 0.97);
        border: 1px solid #b28b3d;
        border-radius: 5px;
        color: #173c69;
      }
      .anu-brand img {
        width: 27px;
        height: 31px;
        object-fit: contain;
      }
      .anu-brand span {
        font-size: 6px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      .widget[data-theme="anu"] .anu-brand {
        display: flex;
      }
      .widget[data-theme="yun"] {
        --paper: rgba(255, 254, 250, 0.79);
        --line: rgba(99, 126, 121, 0.2);
        --green: #315f58;
        --orange: #aa8850;
        --ink: #202722;
        --theme-shadow: rgba(35, 65, 62, 0.18);
        border: 1px solid rgba(173, 146, 89, 0.6);
        border-radius: 25px;
        box-shadow:
          0 18px 55px var(--theme-shadow),
          inset 0 0 0 3px rgba(209, 185, 125, 0.2);
      }
      .widget[data-theme="mo"] {
        --paper: rgba(255, 255, 255, 0.82);
        --line: rgba(48, 50, 49, 0.17);
        --green: #343735;
        --orange: #4a4c4b;
        --ink: #202120;
        --theme-shadow: rgba(29, 30, 29, 0.16);
        border: 1px solid rgba(77, 79, 77, 0.25);
        border-radius: 29px;
      }
      .widget[data-theme="zhu"] {
        --paper: rgba(255, 255, 251, 0.78);
        --line: rgba(77, 101, 85, 0.2);
        --green: #315c4c;
        --orange: #536d56;
        --ink: #1e2923;
        --theme-shadow: rgba(42, 66, 53, 0.16);
        border: 4px double #38594c;
        border-radius: 23px;
        box-shadow:
          0 18px 55px var(--theme-shadow),
          inset 0 0 0 3px rgba(190, 162, 99, 0.42);
      }
      .widget[data-theme="xia"] {
        --paper: rgba(255, 250, 239, 0.79);
        --line: rgba(181, 94, 49, 0.25);
        --green: #9c3c20;
        --orange: #b94d2c;
        --ink: #38251d;
        --theme-shadow: rgba(148, 65, 30, 0.21);
        border: 4px double #a94a26;
        border-radius: 23px;
        box-shadow:
          0 18px 55px var(--theme-shadow),
          inset 0 0 0 3px rgba(229, 173, 89, 0.42);
      }
      .widget[data-theme="yun"] .section-label.mainline,
      .widget[data-theme="zhu"] .section-label.mainline,
      .widget[data-theme="xia"] .section-label.mainline {
        color: var(--green);
      }
      .widget[data-theme="yun"] .section-label.side,
      .widget[data-theme="zhu"] .section-label.side,
      .widget[data-theme="xia"] .section-label.side {
        color: var(--orange);
      }
      .widget[data-theme="mo"] .section-label {
        color: #353735;
      }
      .widget[data-theme="yun"] .task,
      .widget[data-theme="zhu"] .task,
      .widget[data-theme="xia"] .task,
      .widget[data-theme="yun"] .footer,
      .widget[data-theme="zhu"] .footer,
      .widget[data-theme="xia"] .footer,
      .widget[data-theme="yun"] .top,
      .widget[data-theme="zhu"] .top,
      .widget[data-theme="xia"] .top {
        border-color: var(--line);
      }
      .widget[data-theme="yun"] .add,
      .widget[data-theme="zhu"] .add,
      .widget[data-theme="xia"] .add {
        color: var(--green);
      }
      .theme-choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .theme-choice {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 8px 9px;
        background: var(--paper);
        color: var(--ink);
        font: inherit;
        font-size: 11px;
        text-align: left;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .theme-choice:before {
        content: "";
        width: 17px;
        height: 17px;
        border-radius: 50%;
        background: var(--swatch);
      }
      .theme-choice[aria-pressed="true"] {
        border-color: var(--green);
        box-shadow: 0 0 0 1px var(--green);
      }
      .theme-choice[data-value="yun"] {
        --swatch: linear-gradient(135deg, #d9e7e0, #547a73);
      }
      .theme-choice[data-value="mo"] {
        --swatch: linear-gradient(135deg, #e5e5e2, #292c2b);
      }
      .theme-choice[data-value="zhu"] {
        --swatch: linear-gradient(135deg, #d9e4d7, #315c4c);
      }
      .theme-choice[data-value="xia"] {
        --swatch: linear-gradient(135deg, #ffe2ad, #a93c1f);
      }
      .theme-choice[data-value="default"] {
        --swatch: linear-gradient(135deg, #fffefa, #607b61);
      }
      .theme-choice[data-value="anu"] {
        --swatch: linear-gradient(135deg, #f7e9bd, #173c69);
      }
      .top {
        padding: 20px 23px 18px;
        border-bottom: 1px solid var(--line);
        user-select: none;
      }
      .topline {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .date-line {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .date {
        font-size: 13px;
        font-weight: 620;
        letter-spacing: 0.02em;
      }
      .date-trigger {
        display: inline-block;
        border: 0;
        padding: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .date-trigger:hover {
        color: var(--green);
        text-decoration: underline;
        text-decoration-color: color-mix(
          in srgb,
          var(--green) 35%,
          transparent
        );
        text-underline-offset: 3px;
      }
      .date-trigger:focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 3px;
        border-radius: 3px;
      }
      .weekday {
        font-size: 11px;
        color: var(--muted);
      }
      .clock {
        font-size: 25px;
        font-variant-numeric: tabular-nums;
        font-weight: 520;
        letter-spacing: 0.025em;
        margin-top: 8px;
      }
      main {
        padding: 5px 23px 17px;
        flex: 1;
        min-height: 0;
      }
      .section {
        padding-top: 16px;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .label-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .section-label {
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.04em;
      }
      .section-label.mainline {
        color: var(--green);
      }
      .section-label.side {
        color: var(--orange);
      }
      .count {
        font-size: 10px;
        color: #aaa99f;
      }
      .add {
        border: 0;
        background: none;
        color: #aaa99f;
        font-size: 18px;
        line-height: 18px;
        cursor: pointer;
        padding: 2px 0 2px 8px;
      }
      .add:hover,
      .expand:hover {
        color: var(--ink);
      }
      .tasks {
        min-height: 36px;
      }
      .task {
        display: grid;
        grid-template-columns: 17px minmax(0, 1fr) auto 15px;
        gap: 8px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #f0f0eb;
        animation: in 0.15s ease-out;
      }
      .task:last-child {
        border-bottom: 0;
      }
      .check {
        width: 15px;
        height: 15px;
        border: 1.4px solid #d5d5cd;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
        padding: 0;
        position: relative;
      }
      .check:hover {
        border-color: var(--green);
      }
      .task.done .check {
        background: var(--green);
        border-color: var(--green);
      }
      .task.done .check:after {
        content: "";
        position: absolute;
        left: 4px;
        top: 1px;
        width: 4px;
        height: 7px;
        border: solid white;
        border-width: 0 1.4px 1.4px 0;
        transform: rotate(45deg);
      }
      .task-title {
        font-size: 12px;
        line-height: 1.45;
        min-width: 0;
        overflow-wrap: anywhere;
        cursor: pointer;
      }
      .task.done .task-title {
        text-decoration: line-through;
        color: #b5b5ad;
      }
      .deadline {
        font-size: 10px;
        color: #999990;
        white-space: nowrap;
      }
      .deadline.soon {
        color: var(--orange);
      }
      .deadline.late {
        color: var(--red);
      }
      .task.done .deadline {
        color: #c1c1ba;
      }
      .expand {
        border: 0;
        background: none;
        color: #b3b3aa;
        cursor: pointer;
        font-size: 10px;
        padding: 3px;
        transition: transform 0.15s;
      }
      .task.open .expand {
        transform: rotate(180deg);
      }
      .details {
        grid-column: 2/-1;
        padding: 2px 0 6px;
        display: none;
        min-height: 20px;
      }
      .task.open .details {
        display: block;
      }
      .notes {
        margin: 0 0 7px;
        padding-left: 16px;
        list-style: none;
        min-height: 8px;
      }
      .notes li {
        position: relative;
        font-size: 11px;
        color: #77786f;
        line-height: 1.55;
        padding: 3px 0 3px 1px;
        overflow-wrap: anywhere;
        cursor: pointer;
      }
      .notes li:before {
        content: "";
        position: absolute;
        left: -12px;
        top: 9px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #c9c9bf;
      }
      .notes li.note-done {
        text-decoration: line-through;
        color: #b6b6ae;
      }
      .sub-add {
        border: 0;
        background: none;
        padding: 4px 0;
        color: var(--green);
        font: inherit;
        font-size: 10px;
        cursor: pointer;
      }
      .sub-add:hover {
        text-decoration: underline;
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 15px 0 1px;
      }
      .footer {
        border-top: 1px solid var(--line);
        padding: 10px 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .draft-trigger,
      .collapse-trigger {
        border: 0;
        background: transparent;
        color: #85867d;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
        display: flex;
        gap: 7px;
        align-items: center;
        padding: 5px 8px;
      }
      .draft-trigger:hover,
      .collapse-trigger:hover {
        color: var(--ink);
      }
      .draft-icon {
        font-size: 13px;
      }
      .key-hint {
        font-size: 9px;
        color: #b0b0a8;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 4px;
      }
      .widget.collapsed {
        width: 352px;
        min-height: 0;
        position: relative;
        padding-bottom: 17px;
      }
      .widget.collapsed.locked {
        min-height: 0;
      }
      .widget.collapsed .top {
        display: block;
        padding: 12px 18px 10px;
      }
      .widget.collapsed .clock {
        font-size: 18px;
        margin-top: 4px;
      }
      .widget.collapsed main {
        padding: 8px 22px 13px;
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .widget.collapsed .section {
        padding-top: 9px;
      }
      .widget.collapsed .section-head {
        margin: 0 0 7px;
      }
      .widget.collapsed .count {
        display: inline;
      }
      .widget.collapsed .add {
        display: block;
      }
      .widget.collapsed .divider {
        display: block;
        margin: 13px 0 1px;
      }
      .widget.collapsed .tasks {
        min-height: 0;
        display: block;
      }
      .widget.collapsed .task {
        grid-template-columns: 16px minmax(0, 1fr) auto 14px;
        padding: 8px 0;
        border-bottom: 1px solid #f0f0eb;
        gap: 9px;
      }
      .widget.collapsed .task-title {
        font-size: var(--task-font, 14px);
      }
      .widget.collapsed .check {
        width: 14px;
        height: 14px;
      }
      .widget.collapsed .task.done .check:after {
        left: 3px;
        top: 0;
        width: 4px;
        height: 7px;
      }
      .widget.collapsed .deadline {
        font-size: 10px;
      }
      .widget.collapsed .details {
        display: none !important;
      }
      .widget.collapsed .expand {
        font-size: 10px;
      }
      .widget.collapsed .draft-trigger,
      .widget.collapsed #lock-toggle,
      .widget.collapsed #settings-open {
        display: none;
      }
      .widget.collapsed .collapse-label {
        display: none;
      }
      .widget.collapsed .footer {
        display: flex;
        position: absolute;
        right: 10px;
        bottom: 7px;
        padding: 0;
        border: 0;
        background: transparent;
        z-index: 2;
      }
      .widget.collapsed .collapse-trigger {
        display: flex;
        width: 22px;
        height: 18px;
        justify-content: center;
        align-items: center;
        padding: 0;
        font-size: 14px;
        color: #a4a49c;
      }
      .widget.collapsed .collapse-trigger:hover {
        color: var(--ink);
      }
      .widget.collapsed .section-label {
        font-size: 13px;
      }
      .widget.collapsed .count {
        font-size: 10px;
      }
      .widget.collapsed .add {
        font-size: 18px;
      }
      .widget main,
      .widget .top,
      .widget .footer {
        transition:
          padding 0.22s ease,
          opacity 0.16s ease,
          transform 0.22s ease;
      }
      .widget .section {
        transition: padding 0.22s ease;
      }
      .widget .task {
        transition:
          padding 0.22s ease,
          grid-template-columns 0.22s ease,
          opacity 0.18s ease;
      }
      .widget .top {
        padding: calc(20px * var(--fit-scale, 1))
          calc(23px * var(--fit-scale, 1)) calc(18px * var(--fit-scale, 1));
      }
      .widget main {
        padding: calc(5px * var(--fit-scale, 1))
          calc(23px * var(--fit-scale, 1)) calc(17px * var(--fit-scale, 1));
        overflow: auto;
        scrollbar-width: thin;
        min-height: 0;
      }
      .widget .section {
        padding-top: calc(16px * var(--fit-scale, 1));
      }
      .widget .task {
        padding: calc(10px * var(--fit-scale, 1)) 0;
        gap: calc(8px * var(--fit-scale, 1));
      }
      .widget .section-label {
        font-size: calc(12px * var(--fit-scale, 1));
      }
      .widget .count {
        font-size: calc(10px * var(--fit-scale, 1));
      }
      .widget .task-title {
        font-size: calc(var(--task-font, 14px) * var(--fit-scale, 1));
      }
      .widget .check {
        width: calc(15px * var(--fit-scale, 1));
        height: calc(15px * var(--fit-scale, 1));
      }
      .widget .date {
        font-size: calc(13px * var(--fit-scale, 1));
      }
      .widget .clock {
        font-size: calc(25px * var(--fit-scale, 1));
      }
      .widget .footer {
        padding: calc(10px * var(--fit-scale, 1))
          calc(15px * var(--fit-scale, 1));
      }
      .widget .collapse-trigger #collapse-icon {
        display: inline-block;
        transition: transform 0.24s ease;
      }
      .widget:not(.collapsed) #collapse-icon {
        transform: rotate(180deg);
      }
      .widget.collapsed #collapse-icon {
        transform: rotate(0);
      }
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(35, 35, 30, 0.18);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 5;
      }
      .scrim.open {
        display: flex;
      }
      .dialog {
        width: min(330px, 100%);
        background: var(--paper);
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.15);
      }
      .dialog h2 {
        margin: 0 0 16px;
        font-size: 16px;
        font-weight: 600;
      }
      .field {
        display: block;
        margin-bottom: 13px;
      }
      .field[hidden] {
        display: none !important;
      }
      .field span {
        display: block;
        color: var(--muted);
        font-size: 10px;
        margin-bottom: 6px;
      }
      .field input,
      .field textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 11px;
        background: white;
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        outline: none;
      }
      .field input:focus,
      .field textarea:focus {
        border-color: #aebaa9;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 17px;
      }
      .actions button {
        border: 0;
        border-radius: 8px;
        padding: 8px 12px;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      .cancel {
        background: #f2f1ed;
        color: #777;
      }
      .save {
        background: var(--green);
        color: white;
      }
      /* Floating scratchpad can be moved by its title bar. */
      .draft-window {
        position: fixed;
        z-index: 20;
        left: calc(50% - 180px);
        top: calc(50% - 170px);
        width: 360px;
        height: 340px;
        background: var(--paper);
        border: 1px solid rgba(40, 40, 32, 0.09);
        border-radius: 14px;
        box-shadow: 0 20px 65px rgba(30, 30, 25, 0.22);
        display: none;
        flex-direction: column;
        overflow: hidden;
      }
      .draft-window.open {
        display: flex;
      }
      .draft-bar {
        height: 42px;
        flex: 0 0 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px 0 15px;
        border-bottom: 1px solid var(--line);
        cursor: move;
        user-select: none;
      }
      .draft-title {
        width: 160px;
        border: 0;

      .schedule-card.schedule-free .schedule-grid-head {
        grid-template-columns: 36px repeat(7, minmax(0, 1fr));
      }
      .schedule-head {
        display: flex;
        flex-shrink: 0;
        user-select: none;
        align-items: center;
        justify-content: space-between;
        padding: 14px 17px;
        border-bottom: 1px solid var(--line);
      }
      .schedule-card.schedule-collapsed .schedule-head {
        border-bottom: 0;
      }
      .schedule-card.schedule-collapsed {
        height: auto !important;
        min-height: 0 !important;
      }
      .schedule-card.schedule-collapsed [data-schedule-resize] {
        display: none;
      }
      .schedule-card.schedule-collapsed .schedule-scroll,
      .schedule-card.schedule-collapsed .schedule-empty {
        display: none;
      }
      .schedule-tools {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .schedule-collapse {
        width: 25px;
        height: 25px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #85867d;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .schedule-collapse:hover {
        background: rgba(96, 123, 97, 0.08);
        color: var(--green);
      }
      .schedule-collapse span {
        display: inline-block;
        transition: transform 0.22s ease;
      }
      .schedule-card.schedule-collapsed .schedule-collapse span {
        transform: rotate(180deg);
      }
      .schedule-title {
        font-size: 12px;
        font-weight: 650;
        color: var(--green);
      }
      .schedule-lock {
        width: 25px;
        height: 25px;
      }
      .schedule-lock svg {
        width: 15px;
        height: 15px;
      }
      .schedule-lock.locked .lock-body {
        fill: currentColor;
      }
      .schedule-lock.locked .lock-shackle {
        stroke: currentColor;
      }
      .schedule-edit {
        width: 25px;
        height: 25px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: transparent;
        color: #85867d;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .schedule-edit:hover {
        color: var(--green);
        border-color: var(--green);
      }
      .schedule-scroll {
        flex: 1 1 auto;
        min-height: 0;
        max-height: var(--schedule-scroll-max-height);
        overflow: auto;
        scrollbar-width: thin;
      }
      .schedule-grid {
        display: grid;
        grid-template-columns: 42px repeat(7, minmax(42px, 1fr));
        min-width: 336px;
        position: relative;
      }
      .schedule-grid-head {
        grid-column: 1/-1;
        display: grid;
        grid-template-columns: 42px repeat(7, minmax(42px, 1fr));
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--paper);
      }
      .schedule-grid-head > div {
        height: 29px;
        display: grid;
        place-items: center;
        border-bottom: 1px solid var(--line);
        font-size: 9px;
        color: var(--muted);
      }
      .schedule-grid-head > div:first-child {
        position: sticky;
        left: 0;
        z-index: 3;
        background: var(--paper);
      }
      .schedule-time {
        height: 22px;
        padding: 3px 4px 0 0;
        text-align: right;
        color: #aaa99f;
        font-size: 8px;
        font-variant-numeric: tabular-nums;
        border-right: 1px solid var(--line);
      }
      .schedule-slot {
        height: 22px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid #f0f0eb;
        position: relative;
      }
      .schedule-slot.hour {
        border-bottom-color: #e4e4dc;
      }
      .schedule-course {
        position: relative;
        z-index: 1;
        align-self: stretch;
        justify-self: stretch;
        min-width: 0;
        margin: 1px 2px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        overflow: hidden;
        padding: 2px 3px;
        border: 0;
        border-radius: 4px;
        background: rgba(96, 123, 97, 0.18);
        color: #456247;
        font: inherit;
        font-size: 8px;
        line-height: 1.2;
        text-align: left;
        overflow-wrap: anywhere;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      .schedule-course[data-tone="1"] {
        background: rgba(194, 122, 84, 0.18);
        color: #985f40;
      }
      .schedule-course[data-tone="2"] {
        background: rgba(105, 137, 160, 0.18);
        color: #45677d;
      }
      .schedule-course[data-tone="3"] {
        background: rgba(151, 126, 164, 0.18);
        color: #665276;
      }
      .schedule-course:active {
        cursor: grabbing;
      }
      .schedule-course.dragging {
        opacity: 0.5;
      }
      .schedule-course.short small {
        display: none;
      }
      .schedule-course small {
        display: block;
        margin-top: 2px;
        font-size: 7px;
        opacity: 0.82;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .schedule-slot.schedule-drop-target {
        background: rgba(96, 123, 97, 0.15);
      }
      .schedule-empty {
        padding: 10px 16px;
        color: #aaa99f;
        font-size: 10px;
        border-top: 1px solid var(--line);
      }
      .schedule-dialog {
        width: min(360px, 100%);
        max-height: min(78vh, 620px);
        overflow: auto;
        background: var(--paper);
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.15);
      }
      .schedule-dialog h2 {
        margin: 0 0 16px;
        font-size: 16px;
        font-weight: 600;
      }
      .schedule-delete-current {
        margin-right: auto !important;
        background: rgba(200, 95, 81, 0.1) !important;
        color: var(--red) !important;
      }
      .schedule-delete-current:hover {
        background: rgba(200, 95, 81, 0.18) !important;
      }
      .schedule-action-spacer {
        flex: 1;
      }
      .schedule-course-form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }
      .schedule-course-form .field {
        margin-bottom: 0;
      }
      .schedule-course-form .course-name {
        grid-column: 1/-1;
      }
      .schedule-course-form select,
      .schedule-course-form input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px;
        background: white;
        color: var(--ink);
        font: inherit;
        font-size: 11px;
      }
      .schedule-course-form .time-pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .schedule-dialog .actions {
        margin-top: 15px;
      }
      @keyframes schedule-in {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (max-width: 420px) {
        .app-stack {
          width: 100%;
        }
      }
      .task-date-picker {
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 9px;
        background: rgba(255, 255, 255, 0.42);
      }
      .task-date-modes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
      }
      .task-date-modes button {
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 7px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 10px;
        cursor: pointer;
      }
      .task-date-modes button[aria-pressed="true"] {
        border-color: var(--green);
        background: rgba(96, 123, 97, 0.1);
        color: var(--green);
        font-weight: 600;
      }
      .task-calendar-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 5px;
        margin-top: 9px;
      }
      .task-calendar-toolbar strong {
        flex: 1;
        text-align: center;
        font-size: 11px;
        font-weight: 600;
      }
      .task-calendar-toolbar button {
        min-width: 27px;
        height: 27px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--paper);
        color: var(--muted);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      .task-calendar-toolbar #task-date-today {
        padding: 0 8px;
      }
      .task-calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 3px;
        margin-top: 7px;
      }
      .task-calendar-weekday {
        height: 21px;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 9px;
      }
      .task-calendar-day {
        height: 29px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 10px;
        cursor: pointer;
      }
      .task-calendar-day:hover {
        background: rgba(96, 123, 97, 0.1);
      }
      .task-calendar-day.outside {
        color: #b7b8b0;
      }
      .task-calendar-day.today {
        box-shadow: inset 0 0 0 1px var(--green);
      }
      .task-calendar-day.in-range {
        border-radius: 0;
        background: rgba(96, 123, 97, 0.12);
      }
      .task-calendar-day.range-start,
      .task-calendar-day.range-end {
        border-color: var(--green);
        border-radius: 7px;
        background: var(--green);
        color: white;
      }
      .task-date-summary {
        min-height: 18px;
        margin-top: 7px;
        color: var(--green);
        font-size: 10px;
      }
      #date-input,
      #date-end-input {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="app-stack" id="app-stack">
      <div class="widget" id="widget">
        <header class="top">
          <div class="topline">
            <div class="date-line">
              <button
                class="date date-trigger"
                id="today-date"
                type="button"
                aria-label="选择查看日期"
                title="选择查看日期"
              ></button
              ><span class="weekday" id="today-weekday"></span
              ><button class="period-trigger" id="period-open" type="button">
                日待办⌄
              </button>
            </div>
            <div class="anu-brand" aria-label="澳洲国立大学校徽">
              <img src="themes/anu-crest.svg" alt="ANU 校徽" /><span>ANU</span>
            </div>
          </div>
          <div
            class="clock"
            id="clock"
            aria-live="off"
            role="button"
            tabindex="0"
            title="点击设置日期和时间"
          ></div>
        </header>
        <main>
          <section class="section">
            <div class="section-head">
              <div class="label-wrap">
                <span class="section-label mainline">主线任务</span
                ><span class="count" id="main-count"></span>
              </div>
              <button class="add" aria-label="添加主线任务" data-add="main">
                +
              </button>
            </div>
            <div class="tasks" id="main-tasks"></div>
          </section>
          <div class="divider"></div>
          <section class="section">
            <div class="section-head">
              <div class="label-wrap">
                <span class="section-label side">支线任务</span
                ><span class="count" id="side-count"></span>
              </div>
              <button class="add" aria-label="添加支线任务" data-add="side">
                +
              </button>
            </div>
            <div class="tasks" id="side-tasks"></div>
          </section>
        </main>
        <footer class="footer">
          <button class="draft-trigger" id="draft-open">
            <span class="draft-icon">✎</span><span>随手记个想法</span
            ><kbd class="key-hint">D</kbd>
          </button>
          <div class="window-controls">
            <button
              class="icon-button pin-button"
              id="widget-pin-toggle"
              type="button"
              aria-label="桌面置顶"
              aria-pressed="false"
              title="将主体置顶到桌面浮窗"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 3h8l-1.3 6 3.3 3v2H6v-2l3.3-3L8 3Z" />
                <path d="M12 14v7" />
              </svg></button
            ><button
              class="icon-button lock-button"
              id="lock-toggle"
              aria-label="锁定窗口"
              title="锁定后无法拖动或调整大小"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect
                  class="lock-body"
                  x="5"
                  y="10"
                  width="14"
                  height="11"
                  rx="2"
                />
                <path class="lock-shackle" d="M8 10V7a4 4 0 1 1 8 0v3" />
              </svg></button
            ><button
              class="icon-button settings-button"
              id="settings-open"
              aria-label="设置"
              title="设置"
            >
              ⚙</button
            ><button
              class="collapse-trigger"
              id="collapse-toggle"
              aria-label="收起窗口"
            >
              <span class="collapse-label">收起</span
              ><span id="collapse-icon">⌃</span>
            </button>
          </div>
        </footer>
        <i class="resize-handle n" data-resize="n"></i
        ><i class="resize-handle e" data-resize="e"></i
        ><i class="resize-handle s" data-resize="s"></i
        ><i class="resize-handle w" data-resize="w"></i
        ><i class="resize-handle ne" data-resize="ne"></i
        ><i class="resize-handle nw" data-resize="nw"></i
        ><i class="resize-handle se" data-resize="se"></i
        ><i class="resize-handle sw" data-resize="sw"></i>
      </div>
      <section class="schedule-card" id="schedule-card" hidden>
        <i class="schedule-resize-handle n ns" data-schedule-resize="n"></i
        ><i class="schedule-resize-handle e ew" data-schedule-resize="e"></i
        ><i class="schedule-resize-handle s ns" data-schedule-resize="s"></i
        ><i class="schedule-resize-handle w ew" data-schedule-resize="w"></i
        ><i class="schedule-resize-handle ne" data-schedule-resize="ne"></i
        ><i class="schedule-resize-handle nw" data-schedule-resize="nw"></i
        ><i class="schedule-resize-handle se" data-schedule-resize="se"></i
        ><i class="schedule-resize-handle sw" data-schedule-resize="sw"></i>
        <header class="schedule-head">
          <span class="schedule-title">每周课表</span>
          <div class="schedule-tools">
            <button
              class="icon-button schedule-lock"
              id="schedule-lock-toggle"
              type="button"
              aria-label="锁定课表"
              aria-pressed="true"
              title="锁定后课表跟随主体"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect
                  class="lock-body"
                  x="5"
                  y="10"
                  width="14"
                  height="11"
                  rx="2"
                />
                <path class="lock-shackle" d="M8 10V7a4 4 0 1 1 8 0v3" />
              </svg></button
            ><button
              class="icon-button pin-button"
              id="schedule-pin-toggle"
              type="button"
              aria-label="桌面置顶"
              aria-pressed="false"
              title="将课表置顶到桌面浮窗"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 3h8l-1.3 6 3.3 3v2H6v-2l3.3-3L8 3Z" />
                <path d="M12 14v7" />
              </svg></button
            ><button
              class="schedule-collapse"
              id="schedule-collapse"
              type="button"
              aria-label="收起课表"
              title="收起课表"
            >
              <span>⌃</span></button
            ><button
              class="schedule-edit"
              id="schedule-edit"
              type="button"
              aria-label="编辑课程"
              title="添加或删除课程"
            >
              ✎
            </button>
          </div>
        </header>
        <div class="schedule-scroll">
          <div
            class="schedule-grid"
            id="schedule-grid"
            role="grid"
            aria-label="周课表"
          ></div>
        </div>
      </section>
    </div>
    <div class="scrim" id="scrim">
      <form class="dialog" id="form">
        <h2 id="dialog-title">添加任务</h2>
        <label class="field"
          ><span>任务内容</span
          ><input
            id="task-input"
            maxlength="60"
            placeholder="写下要做的事"
            required
        /></label>
        <div class="field" id="date-field">
          <span>计划日期</span>
          <div class="task-date-picker">
            <div class="task-date-modes">
              <button type="button" id="task-date-single" aria-pressed="true">
                单日</button
              ><button type="button" id="task-date-range" aria-pressed="false">
                日期范围
              </button>
            </div>
            <div class="task-calendar-toolbar">
              <button type="button" id="task-calendar-prev" aria-label="上个月">
                ‹</button
              ><strong id="task-calendar-month"></strong
              ><button
                type="button"
                id="task-calendar-next"
                aria-label="下个月"
              >
                ›</button
              ><button type="button" id="task-date-today">今天</button>
            </div>
            <div
              class="task-calendar-grid"
              id="task-calendar"
              role="grid"
            ></div>
            <div
              class="task-date-summary"
              id="task-date-summary"
              aria-live="polite"
            ></div>
            <input id="date-input" type="hidden" /><input
              id="date-end-input"
              type="hidden"
            />
          </div>
        </div>
        <label class="field" id="time-field" hidden
          ><span>待办时间</span><input id="time-input" type="time"
        /></label>
        <div class="actions">
          <button type="button" class="cancel" id="cancel">取消</button
          ><button type="submit" class="save">添加</button>
        </div>
      </form>
    </div>
    <div class="scrim" id="clock-scrim">
      <section class="dialog">
        <h2>日期和时间</h2>
        <label class="field"
          ><span>手动设置（留空时跟随系统）</span
          ><input type="datetime-local" id="manual-datetime" step="60"
        /></label>
        <div class="actions">
          <button type="button" class="cancel" id="clock-system">
            同步系统时间</button
          ><button type="button" class="save" id="clock-save">保存</button>
        </div>
      </section>
    </div>
    <div class="scrim" id="period-scrim">
      <section class="period-dialog">
        <h2 id="period-title">选择待办周期</h2>
        <div class="period-kind" id="period-kind">
          <button type="button" data-period="day">日</button
          ><button type="button" data-period="week">周</button
          ><button type="button" data-period="month">月</button
          ><button type="button" data-period="custom">自定义</button>
        </div>
        <div class="period-range" id="period-range"></div>
        <div class="actions">
          <button type="button" class="cancel" id="period-cancel">取消</button
          ><button type="button" class="save" id="period-apply">应用</button>
        </div>
      </section>
    </div>
    <div class="scrim" id="settings-scrim">
      <section class="dialog">
        <h2>显示设置</h2>
        <label class="field"
          ><span>语言</span
          ><select id="language-select" class="setting-select">
            <option value="zh-CN">简体中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="zh-TW">繁體中文</option>
          </select></label
        ><label class="field"
          ><span>主题</span>
          <div class="theme-choices" id="theme-choices">
            <button
              type="button"
              class="theme-choice"
              data-value="default"
              aria-pressed="true"
            >
              默认主题</button
            ><button
              type="button"
              class="theme-choice"
              data-value="yun"
              aria-pressed="false"
            >
              云佩青岚</button
            ><button
              type="button"
              class="theme-choice"
              data-value="mo"
              aria-pressed="false"
            >
              孤锋入墨</button
            ><button
              type="button"
              class="theme-choice"
              data-value="zhu"
              aria-pressed="false"
            >
              竹影听风</button
            ><button
              type="button"
              class="theme-choice"
              data-value="xia"
              aria-pressed="false"
            >
              赤霞长安</button
            ><button
              type="button"
              class="theme-choice"
              data-value="anu"
              aria-pressed="false"
            >
              血战ANU
            </button>
          </div></label
        ><label class="field"
          ><span>时区</span
          ><select id="timezone-select" class="setting-select"></select></label
        ><label class="field"
          ><span>字体大小 <b id="font-size-value">14</b> px</span
          ><input id="font-size-range" type="range" min="10" max="18" step="1"
        /></label>
        <div class="course-setting">
          <div>
            <span style="font-size: 12px">课表</span><small>课程安排开关</small>
          </div>
          <button
            type="button"
            class="switch"
            id="course-toggle"
            role="switch"
            aria-checked="false"
            aria-label="课表"
          ></button>
        </div>
        <div class="course-setting" id="startup-setting" hidden>
          <div>
            <span style="font-size: 12px">开机自启动</span
            ><small>登录系统时自动显示桌面组件</small>
          </div>
          <button
            type="button"
            class="switch"
            id="startup-toggle"
            role="switch"
            aria-checked="false"
            aria-label="开机自启动"
          ></button>
        </div>
        <div class="actions settings-actions">
          <button type="button" class="cancel" id="reset-defaults">
            恢复默认状态</button
          ><button type="button" class="save" id="settings-close">完成</button>
        </div>
      </section>
    </div>
    <div class="scrim" id="schedule-scrim">
      <section
        class="schedule-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="schedule-dialog-title"
      >
        <h2 id="schedule-dialog-title">添加课程</h2>
        <form id="schedule-form">
          <div class="schedule-course-form">
            <label class="field course-name"
              ><span>课程名称</span
              ><input
                id="course-name"
                maxlength="40"
                placeholder="例如：高等数学"
                required /></label
            ><label class="field"
              ><span>上课位置 / 课室</span
              ><input
                id="course-room"
                maxlength="40"
                placeholder="例如：教学楼 201" /></label
            ><label class="field"
              ><span>授课老师</span

          courseEnd.value = "540";
        }
        scheduleScrim.classList.add("open");
        $("course-name").focus();
      }
      $("schedule-edit").onclick = () => openScheduleEditor();
      $("schedule-cancel").onclick = () => closeScrim(scheduleScrim);
      $("schedule-delete-current").onclick = () => {
        if (!editingCourseId) return;
        if (
          !saveCourses(
            courses.filter((course) => course.id !== editingCourseId),
          )
        )
          return;
        closeScrim(scheduleScrim);
        toast("课程已删除");
      };
      scheduleScrim.onclick = (e) => {
        if (e.target === scheduleScrim) closeScrim(scheduleScrim);
      };
      $("schedule-form").onsubmit = (e) => {
        e.preventDefault();
        const name = $("course-name").value.trim(),
          room = $("course-room").value.trim(),
          teacher = $("course-teacher").value.trim(),
          start = Number(courseStart.value),
          end = Number(courseEnd.value);
        if (!name) return;
        if (end <= start) {
          toast("结束时间需晚于开始时间");
          return;
        }
        const values = {
          name,
          room,
          teacher,
          day: Number(courseDay.value),
          start,
          end,
        };
        if (editingCourseId) {
          const course = courses.find(
            (course) => course.id === editingCourseId,
          );
          if (!course) {
            closeScrim(scheduleScrim);
            toast("课程已删除");
            return;
          }
          if (
            !saveCourses(
              courses.map((item) =>
                item === course ? { ...item, ...values } : item,
              ),
            )
          )
            return;
          toast("课程已更新");
        } else {
          if (
            !saveCourses([...courses, { id: crypto.randomUUID(), ...values }])
          )
            return;
          toast("课程已添加");
        }
        closeScrim(scheduleScrim);
      };
      const courseToggle = $("course-toggle");
      courseToggle.setAttribute(
        "aria-checked",
        String(!!settings.courseEnabled),
      );
      courseToggle.onclick = () => {
        if (
          !saveSettings({ ...settings, courseEnabled: !settings.courseEnabled })
        )
          return;
        window.desktopBridge?.setCourseEnabled?.(settings.courseEnabled);
        updateScheduleVisibility();
        toast(settings.courseEnabled ? "课表已开启" : "课表已关闭");
      };
      updateScheduleVisibility();
      function handleGlobalKeydown(e) {
        if (e.key === "Escape") {
          activeDocument().querySelectorAll(".scrim.open").forEach(closeScrim);
          hideDraft();
        }
        if (
          e.key?.toLowerCase() === "d" &&
          !e.ctrlKey &&
          !e.metaKey &&
          !e.altKey &&
          !activeDocument().activeElement.isContentEditable &&
          !["INPUT", "TEXTAREA", "SELECT"].includes(
            activeDocument().activeElement.tagName,
          )
        )
          showDraft();
      }
      onDocument("keydown", handleGlobalKeydown);
      window.addEventListener("storage", (event) => {
        try {
          if (event.key === KEY) {
            tasks = normalizeTasks(JSON.parse(event.newValue));
            render();
          } else if (event.key === SETTINGS_KEY) {
            const previous = settings;
            settings = normalizeSettings(JSON.parse(event.newValue));
            if (previous.theme !== settings.theme) applyTheme(settings.theme);
            if (previous.fontSize !== settings.fontSize) applyFontSize();
            zoneSelect.value = settings.timezone;
            const periodChanged = [
              "periodMode",
              "periodStart",
              "periodEnd",
            ].some((key) => previous[key] !== settings[key]);
            if (previous.language !== settings.language) applyLanguage();
            else {
              if (periodChanged) render();
              if (
                periodChanged ||
                [
                  "timezone",
                  "manualTime",
                  "manualTimeSavedAt",
                  "followSystemDate",
                ].some((key) => previous[key] !== settings[key])
              )
                updateClock();
            }
            if (previous.courseEnabled !== settings.courseEnabled)
              updateScheduleVisibility();
          } else if (event.key === SCHEDULE_KEY) {
            courses = normalizeCourses(JSON.parse(event.newValue));
            drawSchedule();
          } else if (event.key === SCHEDULE_LAYOUT_KEY) {
            scheduleLayout = {
              ...scheduleLayout,
              ...JSON.parse(event.newValue || "{}"),
            };
            applyScheduleLayout();
          } else if (event.key === LOCK_KEY) {
            setLocked(event.newValue === "1", false);
          } else if (event.key === UI_KEY) {
            widget.classList.toggle("collapsed", event.newValue === "1");
            syncCollapse();
          } else if (
            event.key === "minimal-task-widget-schedule-collapsed-v1"
          ) {
            scheduleCollapsed = event.newValue === "1";
            syncScheduleCollapse();
          } else if (event.key === SCHEDULE_LOCK_KEY) {
            scheduleLocked = event.newValue === "1";
            applyScheduleLayout();
            updateScheduleLockButton();
          }
        } catch {
          /* Ignore a malformed update and retain the current view. */
        }
      });
      applyLanguage();
      reportWidgetBounds();
      reportScheduleBounds();
    </script>
  </body>
</html>
