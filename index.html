<footer class="footer"><button class="draft-trigger" id="draft-open"><span class="draft-icon">✎</span><span>随手记个想法</span><kbd class="key-hint">D</kbd></button><div class="window-controls"><button class="icon-button lock-button" id="lock-toggle" aria-label="锁定窗口" title="锁定后无法拖动或调整大小"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="lock-body" x="5" y="10" width="14" height="11" rx="2"/><path class="lock-shackle" d="M8 10V7a4 4 0 1 1 8 0v3"/></svg></button><button class="icon-button settings-button" id="settings-open" aria-label="设置" title="设置">⚙</button><button class="collapse-trigger" id="collapse-toggle" aria-label="收起窗口"><span class="collapse-label">收起</span><span id="collapse-icon">⌃</span></button></div></footer><i class="resize-handle n" data-resize="n"></i><i class="resize-handle e" data-resize="e"></i><i class="resize-handle s" data-resize="s"></i><i class="resize-handle w" data-resize="w"></i><i class="resize-handle ne" data-resize="ne"></i><i class="resize-handle nw" data-resize="nw"></i><i class="resize-handle se" data-resize="se"></i><i class="resize-handle sw" data-resize="sw"></i></div>
<div class="scrim" id="scrim"><form class="dialog" id="form"><h2 id="dialog-title">添加任务</h2><label class="field"><span>任务内容</span><input id="task-input" maxlength="60" placeholder="写下要做的事" required /></label><label class="field"><span>截止日期</span><input id="date-input" type="date" /></label><div class="actions"><button type="button" class="cancel" id="cancel">取消</button><button type="submit" class="save">添加</button></div></form></div>
<div class="scrim" id="sub-scrim"><form class="dialog" id="sub-form"><h2>添加说明事项</h2><label class="field"><span>子项目 / 说明</span><input id="sub-input" maxlength="100" placeholder="写下下一步或补充说明" required /></label><div class="actions"><button type="button" class="cancel" id="sub-cancel">取消</button><button type="submit" class="save">添加</button></div></form></div>
<div class="scrim" id="settings-scrim"><section class="dialog"><h2>显示设置</h2><label class="field"><span>主题</span><div class="theme-choices" id="theme-choices"><button type="button" class="theme-choice" data-value="default" aria-pressed="true">默认主题</button><button type="button" class="theme-choice" data-value="yun" aria-pressed="false">云佩青岚</button><button type="button" class="theme-choice" data-value="mo" aria-pressed="false">孤锋入墨</button><button type="button" class="theme-choice" data-value="zhu" aria-pressed="false">竹影听风</button><button type="button" class="theme-choice" data-value="xia" aria-pressed="false">赤霞长安</button><button type="button" class="theme-choice" data-value="anu" aria-pressed="false">血战ANU</button></div></label><label class="field"><span>时区</span><select id="timezone-select" class="setting-select"></select></label><label class="field"><span>字体大小 <b id="font-size-value">14</b> px</span><input id="font-size-range" type="range" min="10" max="18" step="1" /></label><div class="actions settings-actions"><button type="button" class="cancel" id="reset-defaults">恢复默认状态</button><button type="button" class="save" id="settings-close">完成</button></div></section></div><div class="draft-window" id="draft-window" aria-label="灵感草稿本"><div class="draft-bar" id="draft-bar"><span class="draft-title">灵感草稿本</span><div class="draft-actions"><button id="draft-pin" title="置顶当前草稿内容">＋</button><button id="draft-minimize" title="收起草稿本">—</button><button id="draft-close" title="关闭草稿本">×</button></div></div><div class="draft-body"><div class="draft-editor" id="draft-editor" contenteditable="true" role="textbox" aria-label="草稿内容" data-placeholder="写下想法，也可以直接粘贴图片……"></div></div><div class="draft-hint">自动保存 · 可复制粘贴图片 · 拖动标题栏移动</div></div><div class="toast" id="toast"></div>
<script>
const KEY='minimal-task-widget-v1',DRAFT_KEY='minimal-task-widget-draft-html-v1',UI_KEY='minimal-task-widget-collapsed-v1',LOCK_KEY='minimal-task-widget-locked-v1',SETTINGS_KEY='minimal-task-widget-settings-v1';
const $=id=>document.getElementById(id);const widget=$('widget');
const initial=[{id:crypto.randomUUID(),type:'main',title:'完成这周最重要的交付',date:'',done:false,items:[]},{id:crypto.randomUUID(),type:'side',title:'整理桌面和收件箱',date:'',done:false,items:[]},{id:crypto.randomUUID(),type:'side',title:'预约下周的体检',date:'',done:false,items:[]}];
let tasks;try{tasks=JSON.parse(localStorage.getItem(KEY))||initial}catch{tasks=initial}tasks=tasks.map(t=>({...t,items:Array.isArray(t.items)?t.items:[]}));let addingType='main',activeTaskId=null;
let settings={timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,fontSize:14,theme:'default'};try{settings={...settings,...JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}}catch{}
function updateClock(){const n=new Date(),opts={timeZone:settings.timezone};$('today-date').textContent=new Intl.DateTimeFormat('zh-CN',{...opts,month:'long',day:'numeric'}).format(n);$('today-weekday').textContent=new Intl.DateTimeFormat('zh-CN',{...opts,weekday:'long'}).format(n);$('clock').textContent=new Intl.DateTimeFormat('zh-CN',{...opts,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(n)}updateClock();setInterval(updateClock,1000);document.documentElement.style.setProperty('--task-font',settings.fontSize+'px');document.documentElement.style.setProperty('--base-font',settings.fontSize+'px');
const themeFiles={yun:'themes/云佩青岚-bg.png',mo:'themes/孤锋入墨-bg.png',zhu:'themes/竹影听风-bg.png',xia:'themes/赤霞长安-bg.png',anu:'themes/anu-campus-bg.png'};function applyTheme(theme){settings.theme=themeFiles[theme]?theme:'default';widget.dataset.theme=settings.theme;document.documentElement.style.setProperty('--theme-art',themeFiles[settings.theme]?`url("${themeFiles[settings.theme]}")`:'none');document.querySelectorAll('.theme-choice').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.value===settings.theme)));localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}applyTheme(settings.theme||'default');
function persist(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}function deadlineLabel(date){if(!date)return '';const target=new Date(date+'T00:00:00'),now=new Date();now.setHours(0,0,0,0);const days=Math.round((target-now)/86400000);return{label:days<0?`逾期 ${Math.abs(days)} 天`:days===0?'今天':days===1?'明天':`${target.getMonth()+1}/${target.getDate()}`,cls:days<0?'late':days<=2?'soon':''}}
function addText(parent,tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;parent.append(el);return el}
function renderGroup(type){const list=tasks.filter(t=>t.type===type),host=$(type==='main'?'main-tasks':'side-tasks');$(type==='main'?'main-count':'side-count').textContent=`${list.filter(t=>!t.done).length} 项待办`;host.innerHTML='';for(const task of list){const row=document.createElement('div');row.className='task'+(task.done?' done':'');row.dataset.id=task.id;const check=addText(row,'button','check');check.setAttribute('aria-label',task.done?'标记未完成':'标记完成');check.onclick=()=>{task.done=!task.done;persist()};const title=addText(row,'div','task-title',task.title);title.onclick=()=>row.classList.toggle('open');title.title='展开 / 收起说明';if(task.date){const d=deadlineLabel(task.date);addText(row,'span','deadline '+d.cls,d.label)}const exp=addText(row,'button','expand','⌄');exp.setAttribute('aria-label','展开说明事项');exp.onclick=()=>row.classList.toggle('open');const details=addText(row,'div','details');details.dataset.dropTask=task.id;const notes=addText(details,'ul','notes');for(const item of task.items){const li=addText(notes,'li',item.done?'note-done':'',item.text);if(item.image){const img=document.createElement('img');img.src=item.image;img.alt='草稿图片';img.className='note-image';li.append(img)}li.onclick=()=>{item.done=!item.done;persist()}}const add=addText(details,'button','sub-add','＋ 添加子项目 / 说明');add.onclick=()=>openSubDialog(task.id);host.append(row)}if(!list.length)host.innerHTML='<div style="font-size:11px;color:#b7b7ae;padding:9px 0 11px">还没有任务，点 + 添加</div>'}
function render(){renderGroup('main');renderGroup('side')}function openDialog(type){addingType=type;$('dialog-title').textContent=type==='main'?'添加主线任务':'添加支线任务';$('task-input').value='';$('date-input').value='';$('scrim').classList.add('open');setTimeout(()=>$('task-input').focus(),30)}function openSubDialog(id){activeTaskId=id;$('sub-input').value='';$('sub-scrim').classList.add('open');setTimeout(()=>$('sub-input').focus(),30)}function closeScrim(el){el.classList.remove('open')}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openDialog(b.dataset.add));$('cancel').onclick=()=>closeScrim($('scrim'));$('scrim').onclick=e=>{if(e.target===$('scrim'))closeScrim($('scrim'))};$('form').onsubmit=e=>{e.preventDefault();const title=$('task-input').value.trim();if(!title)return;tasks.push({id:crypto.randomUUID(),type:addingType,title,date:$('date-input').value,done:false,items:[]});closeScrim($('scrim'));persist()};$('sub-cancel').onclick=()=>closeScrim($('sub-scrim'));$('sub-scrim').onclick=e=>{if(e.target===$('sub-scrim'))closeScrim($('sub-scrim'))};$('sub-form').onsubmit=e=>{e.preventDefault();const text=$('sub-input').value.trim(),task=tasks.find(t=>t.id===activeTaskId);if(!text||!task)return;task.items.push({id:crypto.randomUUID(),text,done:false});closeScrim($('sub-scrim'));persist();const row=document.querySelector(`[data-id="${CSS.escape(activeTaskId)}"]`);if(row)row.classList.add('open')};
const pendant=$('pendant');let pendantAngle=0,pendantVelocity=0,pendantFrame=0,pendantLast=0,pendantPointer=null;const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');function animatePendant(now){const dt=Math.min((now-pendantLast)/1000,.04);pendantLast=now;const acceleration=-34*Math.sin(pendantAngle*Math.PI/180)-5.2*pendantVelocity;pendantVelocity+=acceleration*dt;pendantAngle+=pendantVelocity*dt;if(Math.abs(pendantAngle)<.025&&Math.abs(pendantVelocity)<.04){pendantAngle=0;pendantVelocity=0;pendant.style.setProperty('--pendant-angle','0deg');pendantFrame=0;return}pendant.style.setProperty('--pendant-angle',pendantAngle.toFixed(2)+'deg');pendantFrame=requestAnimationFrame(animatePendant)}pendant.addEventListener('pointerdown',e=>{if(widget.dataset.theme!=='yun')return;e.preventDefault();pendantPointer={id:e.pointerId,lastX:e.clientX,lastTime:performance.now()};pendant.setPointerCapture(e.pointerId);if(pendantFrame)cancelAnimationFrame(pendantFrame);pendantFrame=0});pendant.addEventListener('pointermove',e=>{if(!pendantPointer||pendantPointer.id!==e.pointerId)return;const now=performance.now(),dx=e.clientX-pendantPointer.lastX,dt=Math.max(.008,(now-pendantPointer.lastTime)/1000),rect=widget.getBoundingClientRect();pendantAngle=Math.max(-62,Math.min(62,pendantAngle+dx/rect.width*45));pendantVelocity=Math.max(-520,Math.min(520,dx/dt/rect.width*400));pendant.style.setProperty('--pendant-angle',pendantAngle.toFixed(2)+'deg');pendantPointer.lastX=e.clientX;pendantPointer.lastTime=now});function releasePendant(e){if(!pendantPointer||pendantPointer.id!==e.pointerId)return;pendantPointer=null;if(reducedMotion.matches){pendantAngle=0;pendantVelocity=0;pendant.style.setProperty('--pendant-angle','0deg');return}pendantLast=performance.now();pendantFrame=requestAnimationFrame(animatePendant)}pendant.addEventListener('pointerup',releasePendant);pendant.addEventListener('pointercancel',releasePendant);reducedMotion.addEventListener('change',()=>{if(reducedMotion.matches){if(pendantFrame)cancelAnimationFrame(pendantFrame);pendantFrame=0;pendantPointer=null;pendantAngle=0;pendantVelocity=0;pendant.style.setProperty('--pendant-angle','0deg')}});const fitObserver=new ResizeObserver(()=>{const r=widget.getBoundingClientRect();if(!r.width||!r.height)return;const fit=Math.max(.78,Math.min(1,r.width/352,r.height/397));widget.style.setProperty('--fit-scale',fit.toFixed(3))});fitObserver.observe(widget);if(localStorage.getItem(UI_KEY)==='1')widget.classList.add('collapsed');function syncCollapse(){const collapsed=widget.classList.contains('collapsed');$('collapse-toggle').setAttribute('aria-label',collapsed?'展开窗口':'收起窗口');document.querySelector('.collapse-label').textContent=collapsed?'展开':'收起';$('collapse-icon').textContent='⌄'}function toggleCollapsed(){widget.classList.toggle('collapsed');localStorage.setItem(UI_KEY,widget.classList.contains('collapsed')?'1':'0');syncCollapse()}$('collapse-toggle').onclick=toggleCollapsed;syncCollapse();
const lockButton=$('lock-toggle');function setLocked(locked){widget.classList.toggle('locked',locked);lockButton.classList.toggle('locked',locked);lockButton.setAttribute('aria-label',locked?'解锁窗口':'锁定窗口');lockButton.title=locked?'解锁后可拖动或调整大小':'锁定后无法拖动或调整大小';localStorage.setItem(LOCK_KEY,locked?'1':'0')}setLocked(localStorage.getItem(LOCK_KEY)==='1');lockButton.onclick=()=>setLocked(!widget.classList.contains('locked'));let widgetDrag=null;const widgetHeader=widget.querySelector('.top');widgetHeader.addEventListener('pointerdown',e=>{if(widget.classList.contains('locked')||e.target.closest('button'))return;const r=widget.getBoundingClientRect();widgetDrag={x:e.clientX-r.left,y:e.clientY-r.top};widgetHeader.setPointerCapture(e.pointerId)});widgetHeader.addEventListener('pointermove',e=>{if(!widgetDrag)return;widget.style.position='fixed';widget.style.margin='0';widget.style.left=Math.max(0,Math.min(innerWidth-widget.offsetWidth,e.clientX-widgetDrag.x))+'px';widget.style.top=Math.max(0,Math.min(innerHeight-widget.offsetHeight,e.clientY-widgetDrag.y))+'px'});widgetHeader.addEventListener('pointerup',()=>widgetDrag=null);
let resizeState=null;document.querySelectorAll('.resize-handle').forEach(handle=>{handle.addEventListener('pointerdown',e=>{if(widget.classList.contains('locked'))return;e.preventDefault();const r=widget.getBoundingClientRect();resizeState={dir:handle.dataset.resize,x:e.clientX,y:e.clientY,left:r.left,top:r.top,width:r.width,height:r.height};widget.style.position='fixed';widget.style.margin='0';handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!resizeState)return;const q=resizeState,dx=e.clientX-q.x,dy=e.clientY-q.y,d=q.dir;let left=q.left,top=q.top,width=q.width,height=q.height;if(d.includes('e'))width=Math.max(260,q.width+dx);if(d.includes('w')){width=Math.max(260,q.width-dx);left=q.left+q.width-width}if(d.includes('s'))height=Math.max(220,q.height+dy);if(d.includes('n')){height=Math.max(220,q.height-dy);top=q.top+q.height-height}left=Math.max(0,left);top=Math.max(0,top);width=Math.min(width,innerWidth-left);height=Math.min(height,innerHeight-top);widget.style.left=left+'px';widget.style.top=top+'px';widget.style.width=width+'px';widget.style.height=height+'px'});handle.addEventListener('pointerup',()=>resizeState=null);handle.addEventListener('pointercancel',()=>resizeState=null)});
const zoneSelect=$('timezone-select'),zones=['Asia/Shanghai','Asia/Tokyo','Asia/Singapore','Asia/Hong_Kong','Asia/Taipei','Asia/Seoul','Asia/Bangkok','Asia/Kolkata','Europe/London','Europe/Paris','America/New_York','America/Los_Angeles','Australia/Sydney'];for(const zone of zones){const option=document.createElement('option');option.value=zone;option.textContent=zone.replace('_',' ');zoneSelect.append(option)}if(!zones.includes(settings.timezone)){const option=document.createElement('option');option.value=settings.timezone;option.textContent=settings.timezone+'（当前）';zoneSelect.prepend(option)}zoneSelect.value=settings.timezone;$('font-size-range').value=settings.fontSize;$('font-size-value').textContent=settings.fontSize;document.querySelectorAll('.theme-choice').forEach(button=>button.onclick=()=>applyTheme(button.dataset.value));$('settings-open').onclick=()=> $('settings-scrim').classList.add('open');$('settings-close').onclick=()=>closeScrim($('settings-scrim'));$('settings-scrim').onclick=e=>{if(e.target===$('settings-scrim'))closeScrim($('settings-scrim'))};zoneSelect.onchange=()=>{settings.timezone=zoneSelect.value;localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));updateClock()};$('reset-defaults').onclick=()=>{settings={timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,fontSize:14,theme:'default'};applyTheme('default');localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));zoneSelect.value=settings.timezone;$('font-size-range').value='14';$('font-size-value').textContent='14';document.documentElement.style.setProperty('--task-font','14px');document.documentElement.style.setProperty('--base-font','14px');updateClock();setLocked(false);widget.classList.remove('collapsed');localStorage.removeItem(UI_KEY);syncCollapse();['position','left','top','width','height','margin'].forEach(prop=>widget.style.removeProperty(prop));closeScrim($('settings-scrim'));toast('已恢复默认显示状态')};$('font-size-range').oninput=e=>{settings.fontSize=Number(e.target.value);$('font-size-value').textContent=settings.fontSize;document.documentElement.style.setProperty('--task-font',settings.fontSize+'px');document.documentElement.style.setProperty('--base-font',settings.fontSize+'px');localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))};
const editor=$('draft-editor'),draftWindow=$('draft-window');try{editor.innerHTML=localStorage.getItem(DRAFT_KEY)||''}catch{}function saveDraft(){localStorage.setItem(DRAFT_KEY,editor.innerHTML)}editor.addEventListener('input',saveDraft);editor.addEventListener('paste',e=>{const image=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'));if(!image)return;e.preventDefault();const file=image.getAsFile();if(!file)return;const reader=new FileReader();reader.onload=()=>{document.execCommand('insertImage',false,reader.result);saveDraft()};reader.readAsDataURL(file)});
function showDraft(){draftWindow.classList.add('open');setTimeout(()=>editor.focus(),20)}function hideDraft(){draftWindow.classList.remove('open')}$('draft-open').onclick=showDraft;$('draft-close').onclick=hideDraft;$('draft-minimize').onclick=hideDraft;let draftDrag=null;$('draft-bar').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=draftWindow.getBoundingClientRect();draftDrag={x:e.clientX-r.left,y:e.clientY-r.top};$('draft-bar').setPointerCapture(e.pointerId)});$('draft-bar').addEventListener('pointermove',e=>{if(!draftDrag)return;draftWindow.style.left=Math.max(0,Math.min(innerWidth-draftWindow.offsetWidth,e.clientX-draftDrag.x))+'px';draftWindow.style.top=Math.max(0,Math.min(innerHeight-draftWindow.offsetHeight,e.clientY-draftDrag.y))+'px'});$('draft-bar').addEventListener('pointerup',()=>draftDrag=null);
function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1400)}function appendDraftToTask(id){const task=tasks.find(t=>t.id===id);if(!task)return;const text=editor.innerText.trim();if(text)task.items.push({id:crypto.randomUUID(),text,done:false});for(const img of editor.querySelectorAll('img'))task.items.push({id:crypto.randomUUID(),text:'草稿图片',image:img.src,done:false});persist();const row=document.querySelector(`[data-id="${CSS.escape(id)}"]`);if(row)row.classList.add('open');toast('已放入任务说明')}$('draft-pin').onclick=()=>{const target=document.querySelector('.task.open');if(!target){toast('先展开一个任务，再把草稿拖到说明区域');return}appendDraftToTask(target.dataset.id);hideDraft()};$('draft-bar').addEventListener('pointerup',()=>{if(draftDrag){const r=draftWindow.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;const target=[...document.querySelectorAll('.task.open .details')].find(d=>{const b=d.getBoundingClientRect();return cx>=b.left&&cx<=b.right&&cy>=b.top&&cy<=b.bottom});if(target)appendDraftToTask(target.dataset.dropTask)}draftDrag=null});document.addEventListener('dragover',e=>{const d=e.target.closest('.details');if(d&&draftWindow.classList.contains('open')){e.preventDefault();d.classList.add('drop-target')}});document.addEventListener('dragleave',e=>{const d=e.target.closest('.details');if(d)d.classList.remove('drop-target')});document.addEventListener('drop',e=>{const d=e.target.closest('.details');if(d&&draftWindow.classList.contains('open')){e.preventDefault();appendDraftToTask(d.dataset.dropTask);hideDraft()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.scrim.open').forEach(closeScrim);hideDraft()}if(e.key.toLowerCase()==='d'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName))showDraft()});render();
</script>
