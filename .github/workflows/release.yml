name: Build and release desktop installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create macOS app icon
        shell: bash
        run: |
          mkdir -p build/icon.iconset
          for spec in '16 16x16' '32 16x16@2x' '32 32x32' '64 32x32@2x' '128 128x128' '256 128x128@2x' '256 256x256' '512 256x256@2x' '512 512x512' '1024 512x512@2x'; do
            set -- $spec
            sips -z "$1" "$1" build/icon.png --out "build/icon.iconset/icon_$2.png" >/dev/null
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-dmg
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            macOS universal DMG supports both Apple Silicon and Intel Macs. It is not signed or notarized yet, so macOS may show a first-open security warning.

            The Windows installer is not publisher-signed and may show a SmartScreen warning.
          files: release-assets/*
